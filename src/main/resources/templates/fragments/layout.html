<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title}">Library</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">📚 Library Manager</a>
  <div>
    <a class="btn btn-outline-light btn-sm me-2" href="/books">Libros</a>
    <a class="btn btn-outline-light btn-sm" href="/loans">Préstamos</a>
  </div>
</nav>

<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</div>

</html>
